# Builds self-contained installers on tag push (v*) or manual dispatch.
# The Windows job runs on windows-latest so better-sqlite3 compiles natively
# for Windows — this is the primary deployment path for the shop machine,
# since a Mac cannot cross-compile the native module.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The release step (softprops/action-gh-release) creates/updates a GitHub
# Release, which needs write access to repo contents. Without this the default
# GITHUB_TOKEN is read-only and the attach step 403s after a successful build.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Don't let one OS job's failure cancel the other — we want the Windows
      # installer even if the mac job trips, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # Installs deps with better-sqlite3 built for *Node* — needed by the
      # reference-DB build script below. electron-builder rebuilds it for
      # Electron's ABI later during packaging (npmRebuild: true).
      - run: npm ci

      - name: Build Scryfall reference DB (bundled into the installer)
        run: npm run build:refdb -- --out resources/reference.db

      - name: Fetch Tesseract traineddata (bundled into the installer)
        run: npm run fetch:tessdata

      - name: Sanity-check reference DB
        run: npm run check:refdb -- --data resources

      - name: Corner-parser unit checks
        run: npm run check:parse

      - name: Build app
        run: npm run build

      - name: Package installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
