<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a36"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd257"/>
      <stop offset="1" stop-color="#f0b52e"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- crest feathers -->
  <path d="M 352 300 Q 280 190 300 120 Q 380 200 402 288 Z" fill="#e8a825"/>
  <path d="M 460 268 Q 440 140 490 70 Q 540 160 520 270 Z" fill="#f5c542"/>
  <path d="M 580 280 Q 630 170 710 130 Q 690 240 622 310 Z" fill="#e8a825"/>
  <!-- side fluff -->
  <path d="M 180 620 Q 120 600 96 550 Q 160 552 208 586 Z" fill="#e8a825"/>
  <path d="M 844 620 Q 904 600 928 550 Q 864 552 816 586 Z" fill="#e8a825"/>
  <!-- head -->
  <ellipse cx="512" cy="590" rx="356" ry="330" fill="url(#head)"/>
  <!-- eyes -->
  <circle cx="380" cy="530" r="62" fill="#12151c"/>
  <circle cx="402" cy="508" r="20" fill="#ffffff"/>
  <circle cx="368" cy="552" r="9" fill="#5a4a1a" opacity="0.0"/>
  <circle cx="644" cy="530" r="62" fill="#12151c"/>
  <circle cx="666" cy="508" r="20" fill="#ffffff"/>
  <!-- beak: front view, pointing down -->
  <path d="M 512 600 L 418 668 Q 512 700 606 668 Z" fill="#e08a2e"/>
  <path d="M 418 668 Q 512 700 606 668 L 512 830 Z" fill="#c9741f"/>
  <!-- beak highlight line -->
  <path d="M 512 600 L 512 826" stroke="#a85e14" stroke-width="8" opacity="0.5"/>
  <!-- cheek blush -->
  <ellipse cx="300" cy="650" rx="52" ry="34" fill="#f09a3e" opacity="0.55"/>
  <ellipse cx="724" cy="650" rx="52" ry="34" fill="#f09a3e" opacity="0.55"/>
</svg>
